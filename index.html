<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lime Jumper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    #game-wrap {
      position: relative;
      /* shrink to fit width or height, whichever is tighter */
      width: min(800px, 100vw, calc(100vh * 800 / 300));
    }
    #c {
      filter: grayscale(1);
      image-rendering: pixelated;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 300;
      cursor: pointer;
      display: block;
      touch-action: none;   /* lets pointerdown fire without scroll delay */
      -webkit-tap-highlight-color: transparent;
    }
    /* Fullscreen button — bottom-right corner of canvas */
    #fs-btn {
      position: absolute;
      bottom: 7px;
      right: 7px;
      width: 30px;
      height: 30px;
      background: rgba(0,0,0,0.38);
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 4px;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      z-index: 10;
    }
    /* Two-corner expand icon drawn with pseudo-elements */
    #fs-btn::before, #fs-btn::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
    }
    #fs-btn::before {
      top: 4px; left: 4px;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
    }
    #fs-btn::after {
      bottom: 4px; right: 4px;
      border-bottom: 2px solid #fff;
      border-right: 2px solid #fff;
    }
    /* Swap to collapse icon when fullscreen */
    #fs-btn.fs-active::before {
      top: 4px; left: 4px;
      border-top: none; border-left: none;
      border-bottom: 2px solid #fff;
      border-right: 2px solid #fff;
    }
    #fs-btn.fs-active::after {
      bottom: 4px; right: 4px;
      border-bottom: none; border-right: none;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
    }
  </style>
</head>
<body>
<div id="game-wrap">
<canvas id="c" width="800" height="300"></canvas>
<button id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen"></button>
</div>

// ── Constants ─────────────────────────────────────────────────────────────────
const PW = 39, PH = 39, PX = 90;   // player size & start x
const BW = 30, BH = 114;           // bottle size (natural: 72×274 at width 30)
const GRAV_UP = 0.55, GRAV_DOWN = 0.28, JV = -14;

// ── Game state ────────────────────────────────────────────────────────────────
let gs = 'idle';    // 'idle' | 'playing' | 'gameover'
let score = 0, hi = 0, spd = 5, tick = 0, spawnIn = 50;
let bgOffset = 0;

const p = { x: PX, y: GY - PH, vy: 0, j: 1 };  // player

let bottles   = [];
let particles = [];
let labels    = [];
let clouds    = [];

// ── Clouds (cloud.png) ───────────────────────────────────────────────────────
function mkCloud(x) {
  const cw = 100;
  const ch = cloudImg.naturalWidth > 0
    ? Math.round(cloudImg.naturalHeight * cw / cloudImg.naturalWidth)
    : 60;
  return { x, y: 15 + Math.random() * 50, dx: 0.25 + Math.random() * 0.45, cw, ch };
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    const c = mkCloud(i * 180 + 20);
    // Ensure no overlap with previously placed clouds
    let attempts = 0;
    while (attempts++ < 20 && clouds.some(o => c.x < o.x + o.cw + 40 && c.x + c.cw > o.x - 40))
      c.x = i * 180 + 20 + Math.random() * 60;
    clouds.push(c);
  }
}

function drawClouds() {
  if (!cloudImg.naturalWidth) return;
  for (const c of clouds)
    ctx.drawImage(cloudImg, ~~c.x, ~~c.y, c.cw, c.ch);
}

// ── Particle burst ────────────────────────────────────────────────────────────
function burst(cx, cy) {
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 1.5 + Math.random() * 4;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 1.5,
      alpha: 1,
      sz: 2 + Math.floor(Math.random() * 4),
    });
  }
}

// ── Input ─────────────────────────────────────────────────────────────────────
function doJump() {
  if (gs !== 'playing') { startGame(); return; }
  if (p.j > 0) { p.vy = JV; p.j--; }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); doJump(); }
});

// Touch: use touchstart (fires instantly, no 300ms delay) with passive:false
// so preventDefault() suppresses scroll/zoom. pointerdown handles mouse.
canvas.addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, { passive: false });
canvas.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') doJump(); });

// ── Fullscreen ────────────────────────────────────────────────────────────────
const fsBtn = document.getElementById('fs-btn');
fsBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();  // don't let this bubble to canvas jump handler
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  }
});
document.addEventListener('fullscreenchange',       () => fsBtn.classList.toggle('fs-active', !!document.fullscreenElement));
document.addEventListener('webkitfullscreenchange', () => fsBtn.classList.toggle('fs-active', !!document.webkitFullscreenElement));

// ── Game logic ────────────────────────────────────────────────────────────────
function startGame() {
  gs = 'playing'; score = 0; spd = 5; tick = 0; spawnIn = 50;
  bottles = []; particles = []; labels = [];
  Object.assign(p, { x: PX, y: GY - PH, vy: 0, j: 2 });
}

function spawnBottles() {
  bottles.push({ x: W + 20, y: GY - BH, bonus: false });
  if (Math.random() < 0.28)
    bottles.push({ x: W + 20 + BW + 24, y: GY - BH, bonus: false });
}

function update(dt60) {
  // Background always scrolls; slower when not in play
  bgOffset += (gs === 'playing' ? spd : 1.5) * dt60;

  if (gs !== 'playing') return;

  tick  += dt60;
  spd    = 5 + Math.floor(tick / 360);
  score += spd * 0.01 * dt60;

  // Player physics
  const prevBottom = p.y + PH;
  p.vy += (p.vy < 0 ? GRAV_UP : GRAV_DOWN) * dt60;
  p.y  += p.vy  * dt60;
  if (p.y < 0)         { p.y = 0;       p.vy = 0; }
  if (p.y + PH >= GY)  { p.y = GY - PH; p.vy = 0; p.j = 1; }

  // Clouds scroll
  for (const c of clouds) {
    c.x -= c.dx * dt60;
    if (c.x + c.cw < 0) {
      const farthest = clouds.reduce((m, cl) => Math.max(m, cl.x + cl.cw), W);
      Object.assign(c, mkCloud(farthest + 60 + Math.random() * 80));
    }
  }

  // Obstacle spawn
  spawnIn -= dt60;
  if (spawnIn <= 0) {
    spawnBottles();
    spawnIn = Math.max(45, 95 - tick * 0.025) + Math.random() * 40;
  }

  // Bottle updates + collision
  for (let i = bottles.length - 1; i >= 0; i--) {
    const b = bottles[i];
    b.x -= spd * dt60;
    if (b.x + BW < 0) { bottles.splice(i, 1); continue; }

    // Inset hitboxes for fairness
    const px = p.x + 5,  py = p.y + 5;
    const pw = PW - 10,  ph = PH - 6;
    const bx = b.x + 2,  by = b.y;
    const bw = BW - 4;

    if (px + pw > bx && px < bx + bw && py + ph > by && py < by + BH) {
      if (p.vy >= 0 && prevBottom <= by + 10) {
        // Landed on top of bottle
        p.y = by - PH; p.vy = 0; p.j = 1;
        if (!b.bonus) {
          b.bonus = true;
          b.hasLime = true;
          score += 50;
          burst(b.x + BW / 2, b.y);
          labels.push({ x: b.x + BW / 2, y: b.y - 4, vy: -1.2, alpha: 1 });
        }
      } else {
        // Side / under hit — game over
        hi = Math.max(hi, ~~score);
        gs = 'gameover';
        return;
      }
    }
  }

  // Particle physics
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x  += pt.vx  * dt60;
    pt.y  += pt.vy  * dt60;
    pt.vy += 0.13   * dt60;
    pt.alpha -= 0.022 * dt60;
    if (pt.alpha <= 0) particles.splice(i, 1);
  }

  // Floating score labels
  for (let i = labels.length - 1; i >= 0; i--) {
    const lb = labels[i];
    lb.y     += lb.vy  * dt60;
    lb.alpha -= 0.018  * dt60;
    if (lb.alpha <= 0) labels.splice(i, 1);
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawSun() {
  if (!sunImg.naturalWidth) return;
  const sw = 72;
  const sh = Math.round(sunImg.naturalHeight * sw / sunImg.naturalWidth);
  ctx.drawImage(sunImg, 10, 8, sw, sh);
}

function drawBackground() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  if (!bgImg.naturalWidth) return;
  const dh = H - 130;  // draw in lower portion only
  const tw = Math.round(bgImg.naturalWidth * dh / bgImg.naturalHeight);
  const startX = -(bgOffset % tw);
  for (let x = startX; x < W; x += tw)
    ctx.drawImage(bgImg, ~~x, 130, tw, dh);
}


function drawHUD() {
  ctx.save();
  ctx.font = '12px "Press Start 2P"';
  ctx.textAlign = 'right';
  const scStr = String(~~score).padStart(5, '0');
  const hiStr = 'HI ' + String(~~hi).padStart(5, '0');
  const scW   = ctx.measureText(scStr).width;
  // Current score — darker
  ctx.fillStyle = '#333';
  ctx.fillText(scStr, W - 12, 28);
  // HI label + hi score — lighter, offset left
  ctx.fillStyle = '#aaa';
  ctx.fillText(hiStr, W - 12 - scW - 18, 28);
  ctx.restore();
}

function sprite(img, x, y, w, h, fallback) {
  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, x, y, w, h);
  } else {
    ctx.fillStyle = fallback;
    ctx.fillRect(x, y, w, h);
  }
}

function drawScene() {
  sprite(limeImg, p.x, p.y, PW, PH, '#555');
  for (const b of bottles) {
    if (b.hasLime && coronalimeImg.naturalWidth > 0) {
      ctx.drawImage(coronalimeImg, b.x, b.y, BW, BH);
    } else {
      sprite(coronaImg, b.x, b.y, BW, BH, '#444');
    }
  }
  for (const pt of particles) {
    ctx.fillStyle = `rgba(20,20,20,${pt.alpha.toFixed(2)})`;
    ctx.fillRect(~~pt.x, ~~pt.y, pt.sz, pt.sz);
  }
  ctx.save();
  ctx.font = '11px "Press Start 2P"';
  ctx.textAlign = 'center';
  for (const lb of labels) {
    ctx.fillStyle = `rgba(20,20,20,${lb.alpha.toFixed(2)})`;
    ctx.fillText('+50', ~~lb.x, ~~lb.y);
  }
  ctx.restore();
}

function draw() {
  drawBackground();
  drawSun();
  drawClouds();
  drawHUD();

  if (gs === 'idle') {
    sprite(limeImg, p.x, p.y, PW, PH, '#555');
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#222';
    ctx.font = '22px "Press Start 2P"';
    ctx.fillText('LIME JUMPER', W / 2, GY / 2 - 8);
    ctx.font = '10px "Press Start 2P"';
    ctx.fillStyle = '#888';
    ctx.fillText('Get the lime in the Corona to score points.', W / 2, GY / 2 + 20);
    ctx.fillText('Press space to jump.', W / 2, GY / 2 + 40);
    ctx.restore();
    return;
  }

  drawScene();

  if (gs === 'gameover') {
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#222';
    ctx.font = '20px "Press Start 2P"';
    ctx.fillText('GAME OVER', W / 2, GY / 2 - 8);
    ctx.font = '8px "Press Start 2P"';
    ctx.fillStyle = '#888';
    ctx.fillText('PRESS SPACE OR TAP TO RESTART', W / 2, GY / 2 + 20);
    ctx.restore();
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
let lastTs = 0;
function loop(ts) {
  // dt in seconds, capped at 100 ms to prevent a huge jump after tab switch
  const dt   = lastTs ? Math.min((ts - lastTs) / 1000, 0.1) : 1 / 60;
  lastTs = ts;
  update(dt * 60);   // dt60 = 1.0 at 60 fps, 0.5 at 120 fps, 2.0 at 30 fps
  draw();
  requestAnimationFrame(loop);
}

function imgReady(img) {
  return new Promise(res => { img.onload = img.onerror = res; });
}

Promise.all([
  document.fonts.ready,
  imgReady(limeImg),
  imgReady(coronaImg),
  imgReady(coronalimeImg),
  imgReady(sunImg),
  imgReady(bgImg),
  imgReady(cloudImg),
]).then(() => {
  initClouds();
  loop();
});
</script>
